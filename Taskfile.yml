version: '3'

vars:
  APPLY_DEBUG_PATCHES: '{{.APPLY_DEBUG_PATCHES | default "false"}}'
  ARCHITECTURES: arm64 a64
  BUILD_NUMBER:
    sh: date "+%Y%m%d.%H%M%S"
  BUILD_DATETIME:
    sh: date "+%s"
  REPO_HOST: '{{.REPO_HOST | default "https://github.com"}}'
  REPO_PATH: '{{.REPO_PATH | default "cawilliamson/treble_leanos"}}'
  WEB_DIR: '{{.WEB_DIR | default "/var/www/build.chrisaw.io"}}'
  CONTAINER_RUN: >-
    podman run --rm --privileged
    --pids-limit=0
    -v "${HOME}/.android-certs:/certs:Z"
    -v "$(pwd):/repo:Z"
    -v "{{.WEB_DIR}}:/web:Z"
    -e APPLY_DEBUG_PATCHES="{{.APPLY_DEBUG_PATCHES}}"
    -e BUILD_DATETIME="{{.BUILD_DATETIME}}"
    -e BUILD_NUMBER="{{.BUILD_NUMBER}}"

tasks:
  default:
    desc: "Default target - runs the full build process"
    cmds:
      - task: build-all

  clean:
    desc: "Clean all build directories to start fresh"
    cmds:
      - rm -rfv out/ src/ tmp/

  build-all:
    desc: "Full build process - simple linear chain"
    deps:
      - build-container
    cmds:
      - task: sync-sources
      - task: prepare-sources
      - task: build-treble-app
      - task: build-arm64
      - task: build-arm32
      - task: prepare-images
      - task: copy-to-webdir
      - task: upload-to-github

  build-container:
    desc: "Build the container image used for all build operations"
    cmds:
      - podman build -t gsi-builder -f Containerfile .

  sync-sources:
    desc: "Step 1: sync sources - clone ponces repo, extract versions, init manifest, and sync"
    deps:
      - build-container
    cmds:
      - mkdir -p out/ src/ tmp/
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c 'echo "Sync sources..." && rm -rf ponces_aosp/'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c 'git clone --depth=1 https://github.com/ponces/treble_aosp.git ponces_aosp/'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c '
            grep "repo init" ponces_aosp/build.sh | sed "s/.*-b \([^ ]*\).*/\1/" > /repo/tmp/.android_version &&
            grep "lunch.*-.*-userdebug" ponces_aosp/build.sh | sed "s/.*-\([^-]*\)-userdebug.*/\1/" > /repo/tmp/.android_version_tag'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c 'repo init -u https://android.googlesource.com/platform/manifest -b $(cat /repo/tmp/.android_version) --depth=1 --git-lfs'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c '
            mkdir -p .repo/local_manifests &&
            cp -v /repo/configs/*.xml .repo/local_manifests/ &&
            cp -v ponces_aosp/build/default.xml .repo/local_manifests/ponces_default.xml &&
            cp -v ponces_aosp/build/remove.xml .repo/local_manifests/ponces_remove.xml'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c 'while ! repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags; do sleep 30; done'

  prepare-sources:
    desc: "Step 2: prepare sources - apply patches and copy prebuilts"
    deps:
      - build-container
    cmds:
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c 'echo "Preparing sources..." && rm -rf patches/ vendor/leanos'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c '
            cp -Rv /repo/patches . &&
            cp -Rv ponces_aosp/patches/trebledroid patches/'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c '
            patches/apply.sh . trebledroid &&
            patches/apply.sh . staging'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c '
            if [ -d ponces_aosp/patches/staging ]; then
              cp -Rv ponces_aosp/patches/staging patches/ponces_staging &&
              patches/apply.sh . ponces_staging;
            fi'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c 'patches/apply.sh . leanos'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c '
            cp -Rfv /repo/external . &&
            cp -Rfv /repo/vendor vendor/leanos'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c '
            if [ "{{.APPLY_DEBUG_PATCHES}}" = "true" ]; then
              patches/apply.sh . debug;
            fi'

  build-treble-app:
    desc: "Step 3: build treble app - compile the treble app"
    deps:
      - build-container
    cmds:
      - |
        {{.CONTAINER_RUN}} -w /repo/src/treble_app gsi-builder \
          /bin/bash -e -c 'echo "Building TrebleApp..."'
      - |
        {{.CONTAINER_RUN}} -w /repo/src/treble_app gsi-builder \
          /bin/bash -e -c 'bash build.sh release'

  build-arch:
    desc: "Build architecture-specific targets"
    internal: true
    vars:
      ARCH: '{{.ARCH}}'
      DISPLAY_NAME: '{{.DISPLAY_NAME}}'
    cmds:
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c 'echo "Building system image..."'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c '
            ANDROID_VERSION_TAG_VAL=$(cat /repo/tmp/.android_version_tag) &&
            pushd device/phh/treble &&
              cp -fv "/repo/configs/leanos.mk" . &&
              bash generate.sh leanos &&
            popd'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c 'rm -rfv out/target/product/tdgsi_{{.ARCH}}_ab/'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c '
            ANDROID_VERSION_TAG_VAL=$(cat /repo/tmp/.android_version_tag) &&
            . build/envsetup.sh &&
            lunch treble_{{.ARCH}}_bvN-${ANDROID_VERSION_TAG_VAL}-userdebug'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c 'make systemimage -j$(nproc --all)'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c 'make target-files-package otatools -j$(nproc --all)'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c 'bash vendor/leanos/keys/sign.sh'
      - |
        {{.CONTAINER_RUN}} -w /repo/src gsi-builder \
          /bin/bash -e -c '
            rm -fv ${OUT}/system.img &&
            unzip -joq ${OUT}/signed-target_files.zip IMAGES/system.img -d ${OUT}/ &&
            rm -fv ${OUT}/signed-target_files.zip &&
            mv -v ${OUT}/system.img /repo/tmp/system_{{.ARCH}}.img'

  build-arm64:
    desc: "Step 4a: build arm64 architecture"
    cmds:
      - task: build-arch
        vars:
          ARCH: arm64
          DISPLAY_NAME: ARM64

  build-arm32:
    desc: "Step 4b: build arm32_binder64 architecture"
    cmds:
      - task: build-arch
        vars:
          ARCH: a64
          DISPLAY_NAME: ARM32_BINDER64

  prepare-images:
    desc: "Step 5: prepare images - rename and compress image files in one step"
    deps:
      - build-container
    cmds:
      - |
        {{.CONTAINER_RUN}} -w /repo/tmp gsi-builder \
          /bin/bash -e -c '
            ANDROID_VERSION=$(cat /repo/tmp/.android_version);
            VERSION_TAG="${ANDROID_VERSION#android-}-{{.BUILD_NUMBER}}";
            for arch in {{.ARCHITECTURES}}; do
              src="system_${arch}.img";
              if [ -f "${src}" ]; then
                dest="LeanOS-${arch}-ab-${VERSION_TAG}.img";
                mv -v "${src}" "${dest}";
                xz -9 -T0 -v -z "${dest}";
              fi;
            done'
      - |
        {{.CONTAINER_RUN}} -w /repo/tmp gsi-builder \
          /bin/bash -e -c 'cp -fv *.img.xz /repo/out/'

  copy-to-webdir:
    desc: "Step 6: copy images to web directory"
    deps:
      - build-container
    cmds:
      - |
        {{.CONTAINER_RUN}} -w /repo/tmp gsi-builder \
          /bin/bash -e -c 'echo "Copying to webdir..."'
      - |
        {{.CONTAINER_RUN}} -w /repo/tmp gsi-builder \
          /bin/bash -e -c '
            ANDROID_VERSION=$(cat /repo/tmp/.android_version);
            VERSION_TAG="${ANDROID_VERSION#android-}-{{.BUILD_NUMBER}}";
            RELEASE_NAME="LeanOS-ab-${VERSION_TAG}";
            mkdir -p "/web/${RELEASE_NAME}" &&
            cp -fv *.img.xz "/web/${RELEASE_NAME}/" &&
            echo "Images copied to /web/${RELEASE_NAME}/"'

  upload-to-github:
    desc: "Step 7: upload images to github"
    dir: out
    cmds:
      - echo "Uploading to GitHub..."
      - git init
      - git remote add origin "{{.REPO_HOST}}/{{.REPO_PATH}}.git"
      - gh repo set-default "{{.REPO_PATH}}"
      - |
        ANDROID_VERSION=$(cat "$(pwd)/../tmp/.android_version") &&
        RELEASE_TAG="${ANDROID_VERSION#android-}-{{.BUILD_NUMBER}}" &&
        RELEASE_NAME="LeanOS-ab-${RELEASE_TAG}" &&
        RELEASE_DESCRIPTION="Download mirror: https://build.chrisaw.io/${RELEASE_NAME}/" &&
        gh release create -d -n "${RELEASE_DESCRIPTION}" -t "LeanOS ${RELEASE_TAG}" "${RELEASE_TAG}" &&
        gh release upload "${RELEASE_TAG}" --clobber -- *.img.xz
      - rm -rf .git/
